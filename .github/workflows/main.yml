name: Convert Markdown to HTML and PDF

on:
  push:
    branches:
      - main # または保護されたブランチ名
  workflow_dispatch: # 手動実行を許可

jobs:
  convert-documents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # LTSのNode.jsバージョンを推奨

      - name: Install npm dependencies
        run: npm install # package.jsonに基づいて依存関係をインストール

      - name: Install system dependencies for Marp and Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto-cjk \
            fonts-ipafont \
            fonts-ipaexfont \
            chromium-browser \
            xvfb \
            libxrender1 \
            libfontconfig1 \
            libxext6 \
            # Puppeteerが必要とする可能性のある追加のライブラリ
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 libnspr4 libnss3 libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libasound2
          echo "System dependencies installed."

      - name: Convert Markdown files
        run: |
          export BASE_PATH="/nitac_jyoken_public_materials"
          export GITHUB_ACTIONS=true
          export CHROME_PATH="/usr/bin/chromium-browser"
          export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" node convert.js

      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions@github.com'

      - name: Commit changes
        run: |
          git add output/ index.html
          git commit -m "Convert Markdown to HTML and PDF [automated]" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
