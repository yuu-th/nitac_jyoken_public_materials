name: Convert Markdown to HTML and PDF

on:
  push:
    branches:
      - main # または保護されたブランチ名
  workflow_dispatch: # 手動実行を許可

jobs:
  convert-documents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # LTSのNode.jsバージョンを推奨

      - name: Install dependencies
        run: |
          npm install marked @marp-team/marp-cli
          # 他に必要なnpmパッケージがあればここに追加

      - name: Install Japanese fonts and other apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-ipafont fonts-ipaexfont \
                                  libxrender1 libfontconfig1 libxext6 xvfb \
                                  wkhtmltopdf # wkhtmltopdfもここでインストール
          echo "Japanese fonts and other dependencies installed."

      - name: Setup wkhtmltopdf with Xvfb
        run: |
          # wkhtmltopdfがXvfb経由で実行されるようにラッパースクリプトを作成
          echo '#!/bin/bash
          xvfb-run -a -s "-screen 0 1280x1024x24" wkhtmltopdf "$@"' | sudo tee /usr/local/bin/wkhtmltopdf-xvfb
          sudo chmod +x /usr/local/bin/wkhtmltopdf-xvfb
          # wkhtmltopdfコマンドをこのラッパーに置き換える
          sudo ln -sf /usr/local/bin/wkhtmltopdf-xvfb /usr/local/bin/wkhtmltopdf
          echo "wkhtmltopdf configured to run with Xvfb."

      - name: Convert Markdown files
        run: node convert.js # convert.jsの実行

      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions@github.com'

      - name: Commit changes
        run: |
          git add output/ index.html
          git commit -m "Convert Markdown to HTML and PDF [automated]" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
