ction[data-marpit-advanced-background-split]{width:100%;height:100%}
</style><link rel="stylesheet" href="/nitac_jyoken_public_materials/style.css"></head><body><div class="bespoke-marp-osc"><button data-bespoke-marp-osc="prev" tabindex="-1" title="Previous slide">Previous slide</button><span data-bespoke-marp-osc="page"></span><button data-bespoke-marp-osc="next" tabindex="-1" title="Next slide">Next slide</button><button data-bespoke-marp-osc="fullscreen" tabindex="-1" title="Toggle fullscreen (f)">Toggle fullscreen</button><button data-bespoke-marp-osc="presenter" tabindex="-1" title="Open presenter view (p)">Open presenter view</button></div><div id=":$p"><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="1" data-paginate="true" data-class="lead" data-theme="my-theme" lang="en-US" class="lead" data-marpit-pagination="1" style="--paginate:true;--class:lead;--theme:my-theme;" data-marpit-pagination-total="23">
<h1 id="python%E3%82%AA%E3%83%96%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88%E6%8C%87%E5%90%91%E3%82%92%E3%81%AF%E3%81%98%E3%82%81%E3%82%88%E3%81%86-%F0%9F%9A%80">Pythonオブジェクト指向をはじめよう！ <img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f680.svg" data-marp-twemoji=""></h1>
<p>プログラミングの新しい考え方</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-marpit-fragments="7" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<h3 id="%E3%81%93%E3%82%8C%E3%81%BE%E3%81%A7%E3%81%AE%E3%83%97%E3%83%AD%E3%82%B0%E3%83%A9%E3%83%9F%E3%83%B3%E3%82%B0%E3%81%A8%E4%BD%95%E3%81%8C%E9%81%95%E3%81%86%E3%81%AE-%F0%9F%A4%94">これまでのプログラミングと何が違うの？ <img class="emoji" draggable="false" alt="🤔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f914.svg" data-marp-twemoji=""></h3>
<ul>
<li data-marpit-fragment="1">
<p>プログラムが大きくなると…</p>
<ul>
<li data-marpit-fragment="2">「このデータはどこで使ってる？」</li>
<li data-marpit-fragment="3">「この処理とあの処理、どう関係してる？」</li>
<li data-marpit-fragment="4">データと処理のつながりが複雑に… <img class="emoji" draggable="false" alt="😭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f62d.svg" data-marp-twemoji=""></li>
</ul>
</li>
<li data-marpit-fragment="5">
<p><strong>オブジェクト指向</strong>なら…</p>
<ul>
<li data-marpit-fragment="6">現実世界の「モノ」のように、データと処理を<strong>ひとまとめ</strong>に！</li>
<li data-marpit-fragment="7">スッキリ整理整頓 <img class="emoji" draggable="false" alt="✨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2728.svg" data-marp-twemoji=""></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-fragments="3" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<h3 id="%E3%82%AA%E3%83%96%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88%E6%8C%87%E5%90%91%E3%81%A3%E3%81%A6%E4%BD%95-%F0%9F%92%A1">オブジェクト指向って何？ <img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""></h3>
<p>現実世界の「モノ」（オブジェクト）をイメージしよう！</p>
<ul>
<li data-marpit-fragment="1"><strong>例：スマートフォン</strong> <img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4f1.svg" data-marp-twemoji="">
<ul>
<li data-marpit-fragment="2"><strong>データ（属性）</strong>: 機種名、画面サイズ、バッテリー残量</li>
<li data-marpit-fragment="3"><strong>処理（メソッド／振る舞い）</strong>: 電話をかける、アプリを起動する</li>
</ul>
</li>
</ul>
<p>プログラムの世界でも、このように「モノ」で考えるのがオブジェクト指向です。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-fragments="4" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<h3 id="%E3%82%AF%E3%83%A9%E3%82%B9%E3%82%AA%E3%83%96%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88%E3%81%AE%E8%A8%AD%E8%A8%88%E5%9B%B3-%F0%9F%9B%A0%EF%B8%8F">クラス：オブジェクトの設計図 <img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6e0.svg" data-marp-twemoji=""></h3>
<ul>
<li data-marpit-fragment="1"><strong>クラス</strong> ＝ オブジェクトの「設計図」や「型」
<ul>
<li data-marpit-fragment="2">例：たい焼きの「たい焼きの型」<img class="emoji" draggable="false" alt="🐟" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f41f.svg" data-marp-twemoji=""></li>
</ul>
</li>
<li data-marpit-fragment="3">同じ種類のオブジェクトが共通して持つ「データ」や「処理」を定義します。</li>
<li data-marpit-fragment="4">Pythonでは <code>class</code> キーワードで作ります。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 犬クラスの設計図 (まだ空っぽ)</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Dog</span>:
    <span class="hljs-keyword">pass</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-fragments="3" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<h3 id="%E3%82%A4%E3%83%B3%E3%82%B9%E3%82%BF%E3%83%B3%E3%82%B9%E8%A8%AD%E8%A8%88%E5%9B%B3%E3%81%8B%E3%82%89%E4%BD%9C%E3%82%89%E3%82%8C%E3%81%9F%E5%AE%9F%E7%89%A9-%E2%9C%A8">インスタンス：設計図から作られた実物 <img class="emoji" draggable="false" alt="✨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2728.svg" data-marp-twemoji=""></h3>
<ul>
<li data-marpit-fragment="1"><strong>インスタンス</strong> ＝ クラス（設計図）から作られた具体的な「モノ」
<ul>
<li data-marpit-fragment="2">例：「たい焼きの型」から作られた、あんこ味やクリーム味の「たい焼き」一つひとつ</li>
</ul>
</li>
<li data-marpit-fragment="3">クラス名の後ろに <code>()</code> をつけて作ります。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Dogクラスからインスタンス（具体的な犬）を作成</span>
pochi = Dog() <span class="hljs-comment"># 「ポチ」という犬インスタンス</span>
hachi = Dog() <span class="hljs-comment"># 「ハチ」という犬インスタンス</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-fragments="3" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<h3 id="__init__%E3%83%A1%E3%82%BD%E3%83%83%E3%83%89%E3%81%AF%E3%81%98%E3%82%81%E3%81%BE%E3%81%97%E3%81%A6%E3%81%AE%E5%84%80%E5%BC%8F-%F0%9F%91%B6"><code>__init__</code>メソッド：はじめまして！の儀式 <img class="emoji" draggable="false" alt="👶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f476.svg" data-marp-twemoji=""></h3>
<ul>
<li data-marpit-fragment="1">インスタンスが作られるとき、<strong>自動的に呼び出される特別なメソッド</strong>。</li>
<li data-marpit-fragment="2">別名：<strong>コンストラクタ</strong> (建設する人)</li>
<li data-marpit-fragment="3">ここで、インスタンスが最初に持つべきデータ（名前、年齢など）を設定します。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dog</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name_param, age_param</span>):
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f"<span class="hljs-subst">{name_param}</span>を作ります！"</span>)
        <span class="hljs-variable language_">self</span>.name = name_param  <span class="hljs-comment"># インスタンス自身のname</span>
        <span class="hljs-variable language_">self</span>.age = age_param    <span class="hljs-comment"># インスタンス自身のage</span>

pochi = Dog(<span class="hljs-string">"ポチ"</span>, <span class="hljs-number">3</span>) <span class="hljs-comment"># このとき __init__ が呼ばれる</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">f"<span class="hljs-subst">{pochi.name}</span>は<span class="hljs-subst">{pochi.age}</span>歳です。"</span>) <span class="hljs-comment"># 出力: ポチは3歳です。</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-fragments="4" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<h3 id="self%E3%81%A3%E3%81%A6%E4%BD%95%E8%80%85-%F0%9F%A4%94-%F0%9F%91%89-%E3%82%A4%E3%83%B3%E3%82%B9%E3%82%BF%E3%83%B3%E3%82%B9%E8%87%AA%E8%BA%AB"><code>self</code>って何者？ <img class="emoji" draggable="false" alt="🤔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f914.svg" data-marp-twemoji=""> <img class="emoji" draggable="false" alt="👉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f449.svg" data-marp-twemoji=""> 「インスタンス自身」</h3>
<ul>
<li data-marpit-fragment="1"><code>__init__</code> や他のメソッドの<strong>最初の引数</strong>に書く <code>self</code>。</li>
<li data-marpit-fragment="2">これは、<strong>作られようとしているインスタンスや、メソッドを呼び出したインスタンスそのもの</strong>を指します。</li>
<li data-marpit-fragment="3"><code>self.name = "ポチ"</code> は「そのインスタンス自身の <code>name</code> に <code>"ポチ"</code> を設定する」という意味。</li>
<li data-marpit-fragment="4">メソッドを定義するときは <code>self</code> を書きますが、呼び出すときは書きません (Pythonが自動でやってくれます！)。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dog</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name</span>): <span class="hljs-comment"># self は作られる犬自身</span>
        <span class="hljs-variable language_">self</span>.name = name

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">introduce</span>(<span class="hljs-params">self</span>): <span class="hljs-comment"># self はこのメソッドを呼んだ犬自身</span>
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f"僕の名前は<span class="hljs-subst">{self.name}</span>です。"</span>)

pochi = Dog(<span class="hljs-string">"ポチ"</span>) <span class="hljs-comment"># Pythonがpochiをselfとして__init__に渡す</span>
pochi.introduce() <span class="hljs-comment"># Pythonがpochiをselfとしてintroduceに渡す</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-fragments="4" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<h3 id="%E5%B1%9E%E6%80%A7%E3%83%A2%E3%83%8E%E3%81%8C%E6%8C%81%E3%81%A4%E3%83%87%E3%83%BC%E3%82%BF-%F0%9F%93%8A">属性：モノが持つデータ <img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4ca.svg" data-marp-twemoji=""></h3>
<ul>
<li data-marpit-fragment="1">インスタンスが持つ、個別のデータ（状態）のこと。
<ul>
<li data-marpit-fragment="2">例：<code>pochi</code> の名前は「ポチ」、年齢は「3歳」</li>
</ul>
</li>
<li data-marpit-fragment="3"><code>__init__</code> メソッドの中で <code>self.属性名 = 値</code> のように設定。</li>
<li data-marpit-fragment="4">外からは <code>インスタンス名.属性名</code> でアクセスしたり、値を変更したりできます。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dog</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name, age</span>):
        <span class="hljs-variable language_">self</span>.name = name
        <span class="hljs-variable language_">self</span>.age = age

pochi = Dog(<span class="hljs-string">"ポチ"</span>, <span class="hljs-number">3</span>)
<span class="hljs-built_in">print</span>(pochi.name)  <span class="hljs-comment"># 出力: ポチ</span>
pochi.age = <span class="hljs-number">4</span>      <span class="hljs-comment"># ポチの年齢を変更</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">f"<span class="hljs-subst">{pochi.name}</span>は<span class="hljs-subst">{pochi.age}</span>歳になりました。"</span>)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-fragments="4" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<h3 id="%E3%83%A1%E3%82%BD%E3%83%83%E3%83%89%E3%83%A2%E3%83%8E%E3%81%8C%E3%81%A7%E3%81%8D%E3%82%8B%E6%93%8D%E4%BD%9C-%F0%9F%90%95%E2%80%8D%F0%9F%A6%BA">メソッド：モノができる操作 <img class="emoji" draggable="false" alt="🐕‍🦺" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f415-200d-1f9ba.svg" data-marp-twemoji=""></h3>
<ul>
<li data-marpit-fragment="1">クラスに定義された、インスタンスが行うことができる操作（関数のようなもの）。
<ul>
<li data-marpit-fragment="2">例：「犬が吠える」「犬が歳をとる」</li>
</ul>
</li>
<li data-marpit-fragment="3">メソッド定義の最初の引数は、必ず <code>self</code>（そのメソッドを呼び出したインスタンス自身）。</li>
<li data-marpit-fragment="4">メソッドの中で <code>self.属性名</code> を使って、そのインスタンス自身のデータを使えます。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dog</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name</span>):
        <span class="hljs-variable language_">self</span>.name = name
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">bark</span>(<span class="hljs-params">self</span>): <span class="hljs-comment"># 吠えるメソッド</span>
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f"<span class="hljs-subst">{self.name}</span>がワン！と吠えました。"</span>)

pochi = Dog(<span class="hljs-string">"ポチ"</span>)
pochi.bark()  <span class="hljs-comment"># 出力: ポチがワン！と吠えました。</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-fragments="8" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<h3 id="oop%E3%81%AE%E3%81%99%E3%81%94%E3%81%84%E3%81%A8%E3%81%93%E3%82%8D%E2%91%A0%E3%82%AB%E3%83%97%E3%82%BB%E3%83%AB%E5%8C%96-%F0%9F%92%8A">OOPのすごいところ①：カプセル化 <img class="emoji" draggable="false" alt="💊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f48a.svg" data-marp-twemoji=""></h3>
<p><strong>情報を守り、整理する！</strong></p>
<ul>
<li data-marpit-fragment="1"><strong>カプセル化</strong>：オブジェクトの内部データ（属性）を隠し、決められた操作（メソッド）を通してのみアクセスするようにすること。</li>
<li data-marpit-fragment="2"><strong>なぜ？</strong>
<ul>
<li data-marpit-fragment="3"><strong>データ保護</strong>: 間違った値が入るのを防ぐ (例: HPがマイナスにならないように)</li>
<li data-marpit-fragment="4"><strong>利用の単純化</strong>: 使う側は内部構造を知らなくてもOK</li>
<li data-marpit-fragment="5"><strong>変更に強く</strong>: 内部の仕組みを変えても、外への影響を少なくできる</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>Pythonでの工夫</strong>:
<ul>
<li data-marpit-fragment="7">属性名の前に "__" (アンダースコア2つ) を付ける(外からアクセスしにくくする)</li>
<li data-marpit-fragment="8"><strong>ゲッター/セッターメソッド</strong>: 値の取得/設定専用のメソッドを作る</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># カプセル化の例</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Player</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name, hp</span>):
        <span class="hljs-variable language_">self</span>.name = name
        <span class="hljs-variable language_">self</span>.__hp = hp <span class="hljs-comment"># __で始まる属性は外から直接触りにくい</span>

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">get_hp</span>(<span class="hljs-params">self</span>): <span class="hljs-comment"># HPを取得するゲッター</span>
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>.__hp

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">set_hp</span>(<span class="hljs-params">self, new_hp</span>): <span class="hljs-comment"># HPを設定するセッター (値のチェックも可能)</span>
        <span class="hljs-keyword">if</span> new_hp &lt; <span class="hljs-number">0</span>:
            <span class="hljs-variable language_">self</span>.__hp = <span class="hljs-number">0</span>
        <span class="hljs-keyword">else</span>:
            <span class="hljs-variable language_">self</span>.__hp = new_hp
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f"<span class="hljs-subst">{self.name}</span>のHPは<span class="hljs-subst">{self.__hp}</span>に。"</span>)

player1 = Player(<span class="hljs-string">"勇者"</span>, <span class="hljs-number">50</span>)
<span class="hljs-comment"># player1.__hp = -100 # 直接は良くない！</span>
player1.set_hp(-<span class="hljs-number">10</span>) <span class="hljs-comment"># 出力: 勇者のHPは0に。</span>
<span class="hljs-built_in">print</span>(player1.get_hp()) <span class="hljs-comment"># 出力: 0</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-fragments="6" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<h3 id="oop%E3%81%AE%E3%81%99%E3%81%94%E3%81%84%E3%81%A8%E3%81%93%E3%82%8D%E2%91%A1%E7%B6%99%E6%89%BF-%F0%9F%91%A8%E2%80%8D%F0%9F%91%A9%E2%80%8D%F0%9F%91%A7%E2%80%8D%F0%9F%91%A6">OOPのすごいところ②：継承 <img class="emoji" draggable="false" alt="👨‍👩‍👧‍👦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f468-200d-1f469-200d-1f467-200d-1f466.svg" data-marp-twemoji=""></h3>
<p><strong>性質を引き継ぎ、拡張する！</strong></p>
<ul>
<li data-marpit-fragment="1"><strong>継承</strong>：既存のクラス（親クラス）の属性やメソッドをまるごと引き継いで、新しいクラス（子クラス）を作ること。</li>
<li data-marpit-fragment="2"><strong>なぜ？</strong>
<ul>
<li data-marpit-fragment="3"><strong>コードの再利用</strong>: 親の機能をそのまま使える！楽ちん！</li>
<li data-marpit-fragment="4"><strong>階層構造</strong>: 「動物」クラス → 「犬」クラス、「猫」クラスのように整理</li>
<li data-marpit-fragment="5"><strong>機能の追加・変更</strong>: 子クラス独自の機能を追加したり、親の機能を上書き（<strong>オーバーライド</strong>）したりできる</li>
</ul>
</li>
<li data-marpit-fragment="6"><code>super()</code>：子クラスから親クラスのメソッドを呼び出すときに使う。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 継承の例</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Animal</span>: <span class="hljs-comment"># 親クラス</span>
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name</span>):
        <span class="hljs-variable language_">self</span>.name = name
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">eat</span>(<span class="hljs-params">self</span>):
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f"<span class="hljs-subst">{self.name}</span>が食事中。"</span>)

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Dog</span>(<span class="hljs-title class_ inherited__">Animal</span>): <span class="hljs-comment"># Animalを継承する子クラス</span>
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name, breed</span>):
        <span class="hljs-built_in">super</span>().__init__(name) <span class="hljs-comment"># 親の__init__を呼び出す</span>
        <span class="hljs-variable language_">self</span>.breed = breed     <span class="hljs-comment"># Dog独自の属性</span>
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">bark</span>(<span class="hljs-params">self</span>):
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f"<span class="hljs-subst">{self.name}</span>(<span class="hljs-subst">{self.breed}</span>)がワン！"</span>)
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">eat</span>(<span class="hljs-params">self</span>): <span class="hljs-comment"># 親のeatをオーバーライド</span>
        <span class="hljs-built_in">super</span>().eat() <span class="hljs-comment"># 親のeatも呼びつつ</span>
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f"<span class="hljs-subst">{self.name}</span>はドッグフードが好き！"</span>)

my_dog = Dog(<span class="hljs-string">"ポチ"</span>, <span class="hljs-string">"柴犬"</span>)
my_dog.eat() <span class="hljs-comment"># Dogのeatが呼ばれる</span>
my_dog.bark()
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-fragments="5" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<h3 id="oop%E3%81%AE%E3%81%99%E3%81%94%E3%81%84%E3%81%A8%E3%81%93%E3%82%8D%E2%91%A2%E3%83%9D%E3%83%AA%E3%83%A2%E3%83%BC%E3%83%95%E3%82%A3%E3%82%BA%E3%83%A0%E5%A4%9A%E6%85%8B%E6%80%A7%F0%9F%8E%AD">OOPのすごいところ③：ポリモーフィズム（多態性）<img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3ad.svg" data-marp-twemoji=""></h3>
<p><strong>同じ指示で、異なる振る舞い！</strong></p>
<ul>
<li data-marpit-fragment="1"><strong>ポリモーフィズム</strong>：「多くの形を持つ」という意味。同じ名前のメソッドを呼び出しても、オブジェクトの種類によって実行される処理が異なること。</li>
<li data-marpit-fragment="2"><strong>なぜ？</strong>
<ul>
<li data-marpit-fragment="3"><strong>柔軟性向上</strong>: コードがスッキリ！「もし犬なら…もし猫なら…」が不要に。</li>
<li data-marpit-fragment="4"><strong>拡張性向上</strong>: 新しい種類のオブジェクトが増えても、既存コードの変更が少ない。</li>
</ul>
</li>
<li data-marpit-fragment="5">継承とオーバーライドが土台！</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># ポリモーフィズムの例 (Animal, Dog, Catクラスは前述のものとする)</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Cat</span>(<span class="hljs-title class_ inherited__">Animal</span>):
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name, toy</span>):
        <span class="hljs-built_in">super</span>().__init__(name)
        <span class="hljs-variable language_">self</span>.toy = toy
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">eat</span>(<span class="hljs-params">self</span>): <span class="hljs-comment"># Catもeatをオーバーライド</span>
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f"<span class="hljs-subst">{self.name}</span>は魚をカリカリ。"</span>)
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">speak</span>(<span class="hljs-params">self</span>):
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f"<span class="hljs-subst">{self.name}</span>がニャー！"</span>)

animals = [Dog(<span class="hljs-string">"ポチ"</span>, <span class="hljs-string">"柴犬"</span>), Cat(<span class="hljs-string">"タマ"</span>, <span class="hljs-string">"ねこじゃらし"</span>)]

<span class="hljs-keyword">for</span> animal <span class="hljs-keyword">in</span> animals:
    animal.eat() <span class="hljs-comment"># 同じ animal.eat() でも、犬と猫で動きが変わる！</span>
    <span class="hljs-comment"># animal.speak() # speakメソッドも同様 (DogとCatに定義されていれば)</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<h3 id="%E5%AE%9F%E8%B7%B5%E3%81%97%E3%81%A6%E3%81%BF%E3%82%88%E3%81%86%E7%B0%A1%E5%8D%98%E3%81%AArpg%E3%82%AD%E3%83%A3%E3%83%A9%E3%82%AF%E3%82%BF%E3%83%BC%E4%BD%9C%E3%82%8A-%E2%9A%94%EF%B8%8F%F0%9F%9B%A1%EF%B8%8F">実践してみよう！簡単なRPGキャラクター作り <img class="emoji" draggable="false" alt="⚔️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2694.svg" data-marp-twemoji=""><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6e1.svg" data-marp-twemoji=""></h3>
<ol>
<li><strong>「モノ」は？</strong>: キャラクター、モンスター</li>
<li><strong>属性は？</strong>: 名前、HP、攻撃力</li>
<li><strong>メソッドは？</strong>: 攻撃する、ダメージを受ける</li>
<li><strong>継承は？</strong>: <code>Character</code>クラス(親) → <code>Hero</code>クラス、<code>Monster</code>クラス(子)</li>
<li><strong>カプセル化は？</strong>: HPを不正な値にされないように</li>
<li><strong>ポリモーフィズムは？</strong>: 「攻撃」で勇者とモンスターの動きを変える</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># RPGキャラクターのイメージ (詳細はoop.md参照)</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Character</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name, hp, attack_power</span>): <span class="hljs-comment"># ...略...</span>
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">attack</span>(<span class="hljs-params">self, target</span>): <span class="hljs-comment"># ...略...</span>
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">take_damage</span>(<span class="hljs-params">self, damage</span>): <span class="hljs-comment"># ...略...</span>

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Hero</span>(<span class="hljs-title class_ inherited__">Character</span>):
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">cast_spell</span>(<span class="hljs-params">self, target</span>): <span class="hljs-comment"># 勇者独自の魔法</span>
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f"<span class="hljs-subst">{self.name}</span>が魔法！"</span>) <span class="hljs-comment"># ...略...</span>
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">attack</span>(<span class="hljs-params">self, target</span>): <span class="hljs-comment"># 勇者の攻撃はちょっと違う (オーバーライド)</span>
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f"勇者<span class="hljs-subst">{self.name}</span>の渾身の一撃！"</span>) <span class="hljs-comment"># ...略...</span>

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Monster</span>(<span class="hljs-title class_ inherited__">Character</span>):
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">roar</span>(<span class="hljs-params">self</span>): <span class="hljs-comment"># モンスター独自の咆哮</span>
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f"<span class="hljs-subst">{self.name}</span>がグオオオ！"</span>) <span class="hljs-comment"># ...略...</span>

hero = Hero(<span class="hljs-string">"アベル"</span>, <span class="hljs-number">100</span>, <span class="hljs-number">15</span>, <span class="hljs-number">10</span>)
slime = Monster(<span class="hljs-string">"スライム"</span>, <span class="hljs-number">30</span>, <span class="hljs-number">8</span>, <span class="hljs-string">"やくそう"</span>)
hero.attack(slime) <span class="hljs-comment"># Heroのattackが呼ばれる</span>
slime.attack(hero) <span class="hljs-comment"># Characterのattackが呼ばれる</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-fragments="2" data-paginate="true" data-theme="my-theme" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:my-theme;" data-marpit-pagination-total="23">
<h4 id="%E8%BA%AB%E8%BF%91%E3%81%AA%E3%82%AA%E3%83%96%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88%E6%8C%87%E5%90%91-%E6%99%AE%E6%AE%B5%E4%BD%BF%E3%81%84%E3%81%AEpython%E3%81%AB%E3%82%82">身近なオブジェクト指向 普段使いのPythonにも！</h4>
<ul>
<li data-marpit-fragment="1"><strong>文字列 (<code>str</code>)</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">my_string = <span class="hljs-string">"hello"</span>
<span class="hljs-built_in">print</span>(<span class="hljs-built_in">type</span>(my_string)) <span class="hljs-comment"># &lt;class 'str'&gt;</span>
<span class="hljs-built_in">print</span>(my_string.upper()) <span class="hljs-comment"># .upper() はstrオブジェクトのメソッド</span>
</code></pre>
</li>
<li data-marpit-fragment="2"><strong>リスト (<code>list</code>)</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">my_list = [<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>]
<span class="hljs-built_in">print</span>(<span class="hljs-built_in">type</span>(my_list)) <span class="hljs-comment"># &lt;class 'list'&gt;</span>
my_list.append(<span class="hljs-number">4</span>)    <span class="hljs-comment"># .append() はlistオブジェクトのメソッド</span>
</code></pre>
</li>
</ul>
<p>ライブラリもオブジェクト指向で設計されているものが多いです！</p>
</section>
