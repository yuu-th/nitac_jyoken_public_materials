<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学習タスク管理</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="______">
      <h1>📚 ______</h1>
      <p>目標: CSS装飾とJavaScript動きをマスターしよう！</p>
    </header>

    <!-- 進捗表示 -->
    <section class="progress-section">
      <h2>📈 学習進捗</h2>
      <div class="progress-container">
        <div class="______">
          <div class="progress-fill" id="______"></div>
        </div>
        <p class="progress-text" id="progressText">0 / 6 完了 (0%)</p>
      </div>
    </section>

    <!-- タスクリスト -->
    <section class="______">
      <h2>✅ タスクリスト</h2>

      <div class="task-item">
        <input type="______" id="task1" class="task-checkbox" />
        <label for="______">HTML基本構造を作成</label>
      </div>

      <div class="task-item">
        <input type="checkbox" id="______" class="task-checkbox" />
        <label for="task2">CSSで基本レイアウト</label>
      </div>

      <div class="task-item">
        <input type="checkbox" id="task3" class="______" />
        <label for="task3">グラデーション背景を追加</label>
      </div>

      <div class="task-item">
        <input type="checkbox" id="task4" class="task-checkbox" />
        <label for="______">ホバーエフェクト実装</label>
      </div>

      <div class="task-item">
        <input type="______" id="task5" class="task-checkbox" />
        <label for="task5">JavaScriptで進捗バー作成</label>
      </div>

      <div class="task-item">
        <input type="checkbox" id="______" class="task-checkbox" />
        <label for="task6">完了エフェクト追加</label>
      </div>
    </section>

    <!-- 完了メッセージ（JavaScriptで表示） -->
    <div class="completion-message" id="______">
      <h2>🎉 おめでとうございます！</h2>
      <p>全てのタスクが完了しました！</p>
    </div>

    <script src="______"></script>
  </body>
</html>

<!-- 
穴埋めのヒント:
1. main-header: ヘッダー部分のクラス名
2. 今日の学習タスク: タイトルのテキスト
3. progress-bar: 進捗バーのコンテナ
4. progressFill: 進捗バーの中身（JavaScript用ID）
5. tasks-section: タスクセクションのクラス名
6. checkbox: チェックボックスのinputタイプ
7. task1: 最初のタスクのID
8. task2: 2番目のタスクのID
9. task-checkbox: チェックボックスのクラス名
10. task4: 4番目のタスクのfor属性
11. checkbox: 5番目のタスクのinputタイプ
12. task6: 最後のタスクのID
13. completionMessage: 完了メッセージのID
14. script.js: JavaScriptファイル名
-->
