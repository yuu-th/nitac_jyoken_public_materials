ここまでの処理を関数に分ける。（この後のセッションで、computerとの対戦をあ実装するが、その際に整理して実装しやすくなるように）

```python
import random

# サイコロを振って目を返す
def roll_die(sides=6):
    return random.randint(1, sides)

# 続行確認
def ask_continue(prompt="もう一度振りますか？ (y/n): "):
    while True:
        ans = input(prompt).lower()
        if ans in ("y", "n"):
            return ans == "y"
        print("無効な入力です。'y' または 'n' を入力してください。")

# 履歴表示
def show_history(history):
    print("これまでの出た目:")
    for i, roll in enumerate(history, start=1):
        print(f" {i}回目: {roll}")
    print("合計:", sum(history))

# メイン処理
if __name__ == "__main__":
    history = []
    while True:
        roll = roll_die()
        history.append(roll)
        print(f"出た目は {roll} です。")
        if not ask_continue():
            print("ゲームを終了します。")
            break
    show_history(history)
```



