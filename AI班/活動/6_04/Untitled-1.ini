次にif文とinputを使って、二回目を振るかどうかを確認


```python
import random

# サイコロを振る
roll = random.randint(1, 6)
print("出た目は"+str(roll)+"です。")
# 二回目を振るかどうか確認
y_or_n = input("もう一度振りますか？ (y/n): ")

if y_or_n == "y":
    roll = random.randint(1, 6)
    print("二回目の出た目は"+str(roll)+"です。")
elif y_or_n == "n":
    print("ゲームを終了します。")
else:
    print("無効な入力です。'y' または 'n' を入力してください。")

```



つぎに、whileループで３回目以降も

```python
import random

while True:
    roll = random.randint(1,6)
    print("出た目は"+str(roll)+"です。")
    y_or_n = input("もう一度振りますか？ (y/n): ")
    if y_or_n == "y":
        continue
    elif y_or_n == "n":
        print("ゲームを終了します。")
        break
    else:
        print("無効な入力です。'y' または 'n' を入力してください。無効なのでゲームを終了します。")
        break

```



リストを用いて、過去のサイコロの出た目を記録する

```python
import random

roll_history_list = []  # 出た目を記録するリスト

while True:
    roll = random.randint(1, 6)
    roll_history_list.append(roll)  # 出た目をリストに追加
    print("出た目は"+str(roll)+"です。")
    y_or_n = input("もう一度振りますか？ (y/n): ")
    if y_or_n == "y":
        continue
    elif y_or_n == "n":
        print("ゲームを終了します。")
        break
    else:
        print("無効な入力です。'y' または 'n' を入力してください。無効なのでゲームを終了します。")
        break

print("これまでの出た目:", roll_history_list)

```

次にforループを使って、リストの合計値を最後に計算するように


```python
import random

roll_history_list = []  # 出た目を記録するリスト

while True:
    roll = random.randint(1, 6)
    roll_history_list.append(roll)  # 出た目をリストに追加
    print("出た目は"+str(roll)+"です。")
    y_or_n = input("もう一度振りますか？ (y/n): ")
    if y_or_n == "y":
        continue
    elif y_or_n == "n":
        print("ゲームを終了します。")
        break
    else:
        print("無効な入力です。'y' または 'n' を入力してください。無効なのでゲームを終了します。")
        break

print("これまでの出た目:", roll_history_list)

# 合計値を計算
total = 0
for roll in roll_history_list:
    total += roll
